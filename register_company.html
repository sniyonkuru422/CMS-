<!DOCTYPE html>
<html>
    <head>
        <title>Register Company - CMS</title>
        <link rel="stylesheet" href="CSS/style.css">
    </head>
    <body>
        <header>
            <h1>Register New Company</h1>
            <form id="companyForm" onsubmit="return validateCompanyForm()">
                <label for="companyName">Company Name:</label>
                <input type="text" id="companyName" name="companyName" required><br><br>

                <label for="Company Email">Email:</label>
                <input type="email" id="companyEmail" name="email" required><br><br>

                <label for="Admin Name">Admin Name:</label>
                <input type="text" id="adminName" name="adminName" required><br><br>

                <label for="Admin Email">Admin Email:</label>
                <input type="email" id="adminEmail" name="adminEmail" required><br><br>

                <label for="Admin Password">Admin Password:</label>
                <input type="password" id="adminPassword" name="adminPassword" required><br><br>

                <button type="submit">Register Company</button>
            </form>
        </header>

        <script src="js/script.js"></script>
        
    </body>
</html>
